version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: winzo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: winzorootpass
      MYSQL_DATABASE: winzo_db
      MYSQL_USER: winzouser
      MYSQL_PASSWORD: winzopassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: winzo_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://winzouser:winzopassword@mysql:3306/winzo_db"
      JWT_SECRET: "winzo-secret-jwt-key-2026"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: winzo_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
